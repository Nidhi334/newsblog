<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPoint.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
        <style>
            *{
                font-family: "Roboto", system-ui!important;

            }
        </style>
</head>

<body>
    <div class="flex flex-1 bg-cyan-800 py-6 px-[10%]  justify-between items-center">
        <a href="{% url 'homepage' %}">
            <h1 class=" text-2xl font-bold text-white"> studyPoint.com</h1>
        </a>

        <form action="{% url 'search' %}" method="get" class="flex bg-white rounded-xl">
            <input type="text" name="q" placeholder="Search for courses, topics..." size="60"
                class="bg-transparent w-full px-3 py-2 rounded-md focus:outline-none" />
            <button type="submit" class="px-4 py-2 round-md">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>

            </button>

        </form>
        <div class="flex  items-center gap-4">
           {% if user.is_authenticated %}
           
        <a href="{% url 'login' %}" class="px-4 mr-2 py-2 rounded-md text-white flex items-center gap-2 hover:bg-red-900">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>

            {{user.username}}
        </a>
        <a href="{% url 'logout' %}" class="px-4 py-2 rounded-md text-black bg-white flex items-center gap-2 hover:bg-red-900">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>

            Logout
        </a>
        {% else %}

        <a href="{% url 'register' %}" class="px-4 py-2 rounded-md flex items-center gap-2 text-black bg-white hover:bg-red-900">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
            </svg>

            Sign Up</a>

           {% endif %}
        </div>
    </div>
    <div class="flex flex-1 py-3 mt-10 px-[5%] divide-x-2">
        <div class="w-3/12">
            <h2 class="text-2xl font-bold text-gray-800">Featured Topics</h2>
            <div class="flex flex-col p-3 gap-3">
                {% for cat in categories %}
                <a href="{% url 'filter' cat.id %}"
                    class="text-slate-800   px-3 py-2 w-full flex  justify-between items-center rounded-xl hover:bg-slate-200">
                    <span class="truncate"> {{cat.name}}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m5.25 4.5 7.5 7.5-7.5 7.5m6-15 7.5 7.5-7.5 7.5" />
                    </svg>

                </a>
                {% endfor %}
            </div>

        </div>
        <div class="w-9/12 pl-3">
            <div class="">
                {% block "content" %}

                {% endblock %}
            </div>

        </div>
    </div>

</body>

</html>
